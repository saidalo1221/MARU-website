# Include this in every nginx location that serves the built frontend
# (nginx drops inherited add_header lines once a location defines its own).
# The API adds its own headers, so do not include it for /api/ or /static/.
#
# The CSP is written for what the storefront actually loads:
#   Stripe / PayPal scripts + frames, OpenStreetMap tiles and address lookup,
#   YouTube (privacy-enhanced) embeds and thumbnails, and the ipapi.co country
#   lookup (only runs after the visitor consents).
# Assumes the API and uploaded media are served from the SAME origin through
# this proxy (/api/ and /static/). If they live on another domain, add that
# domain to connect-src, img-src and media-src.
#
# Roll out with Content-Security-Policy-Report-Only first, watch the browser
# console for violations on checkout (Stripe/PayPal) and the address map, then
# switch to Content-Security-Policy.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://www.paypal.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://img.youtube.com; media-src 'self'; frame-src https://www.youtube-nocookie.com https://js.stripe.com https://www.paypal.com; connect-src 'self' https://ipapi.co https://nominatim.openstreetmap.org https://api.stripe.com https://www.paypal.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
